<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Economics Journal Tags</title><link rel="stylesheet" href="options.css"></head><body><main><header><h1>Economics Journal Tags</h1><p>选择要显示的期刊分类标签（可多选）</p></header><section class="grid" aria-label="期刊分类"><label class="option"><input type="checkbox" id="top5"><span>TOP5</span></label><label class="option"><input type="checkbox" id="ft50"><span>FT50</span></label><label class="option"><input type="checkbox" id="utd24"><span>UTD24</span></label><label class="option"><input type="checkbox" id="school"><span>学校目录</span></label></section><details><summary>学校期刊目录 <small>导入 / 导出</small></summary><div class="panel"><p>支持 CSV / JSON。旧格式 <code>title,level</code> 或中文表头 <code>期刊名称,学校等级</code>。</p><input type="file" id="upload" accept=".csv,.txt,.json"><textarea id="data" spellcheck="false" aria-label="学校目录内容" placeholder="期刊名称,学校等级&#10;Journal of Economic Theory,A类"></textarea><div class="actions"><button id="download" type="button" class="secondary">导出 CSV</button><button id="clear" type="button" class="secondary">清空学校目录</button></div></div></details><details><summary>高级选项 <small>可选</small></summary><div class="panel"><label for="crossrefEmail">学术接口联系邮箱（可选）</label><input type="email" id="crossrefEmail" inputmode="email" autocomplete="email" maxlength="254" spellcheck="false" placeholder="yourname@163.com"><p>支持 163、126、QQ、Gmail、Outlook 和高校邮箱。邮箱仅保存在 Firefox 本地，用于向文献元数据接口提供联系地址；留空也可正常使用。</p><p>当检索页面的期刊名被截断时，插件可能通过第三方文献元数据服务查询论文标题、作者、年份及 DOI。不会传送账号或登录信息。</p></div></details><footer><p id="status" role="status" aria-live="polite"></p><button id="save" type="button">保存设置</button><small>期刊目录以相应年份的官方名单及本校规定为准。</small></footer></main><script src="js/politeEmail.js"></script><script src="options.js"></script></body></html>
